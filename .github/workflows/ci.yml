name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Download NLTK resources
        run: python scripts/bootstrap_nltk.py
      - name: Compile source modules
        run: python -m compileall -q src
      - name: Run tests
        run: pytest -q
      - name: Audit image assets
        run: python scripts/audit_image_assets.py
