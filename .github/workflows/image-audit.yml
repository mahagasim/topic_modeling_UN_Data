name: Image asset audit report

on:
  push:
    branches: [fix-graph-rendering]
    paths-ignore:
      - IMAGE_AUDIT.txt

permissions:
  contents: write

jobs:
  audit-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit referenced image assets
        shell: bash
        run: |
          python scripts/audit_image_assets.py > IMAGE_AUDIT.txt 2>&1 || true
          cat IMAGE_AUDIT.txt
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_AUDIT.txt
          git diff --cached --quiet || git commit -m "Record image asset audit"
          git push
