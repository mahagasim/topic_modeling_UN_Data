name: Repair image assets

on:
  push:
    branches: [main]
    paths:
      - coursework/ai_course/figures/**
      - coursework/social_media_web_analytics/figures/**
      - scripts/repair_image_assets.py
      - scripts/audit_image_assets.py
      - .github/workflows/image-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair raster assets written as text/base64
        shell: bash
        run: |
          python scripts/repair_image_assets.py > IMAGE_REPAIR.txt 2>&1
          cat IMAGE_REPAIR.txt
      - name: Re-audit image references
        shell: bash
        run: |
          python scripts/audit_image_assets.py > IMAGE_AUDIT.txt 2>&1
          cat IMAGE_AUDIT.txt
      - name: Commit repaired assets and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coursework/ai_course/figures coursework/social_media_web_analytics/figures IMAGE_REPAIR.txt IMAGE_AUDIT.txt
          if git diff --cached --quiet; then
            echo "No image repairs to commit"
            exit 0
          fi
          git commit -m "Repair raster figure binaries"
          git push origin HEAD:main
