name: Repair image assets

on:
  push:
    branches: [fix-graph-rendering]
    paths-ignore:
      - IMAGE_REPAIR.txt
      - IMAGE_AUDIT.txt

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair raster assets written as text/base64
        shell: bash
        run: |
          python scripts/repair_image_assets.py > IMAGE_REPAIR.txt 2>&1 || true
          cat IMAGE_REPAIR.txt
      - name: Re-audit image references
        shell: bash
        run: |
          python scripts/audit_image_assets.py > IMAGE_AUDIT.txt 2>&1 || true
          cat IMAGE_AUDIT.txt
      - name: Commit repaired assets and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Repair broken image assets"
          git push
