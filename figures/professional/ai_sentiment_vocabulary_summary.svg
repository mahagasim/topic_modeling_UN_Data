<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#5d677a}.head{font-size:22px;font-weight:700}.big{font-size:30px;font-weight:700}.mid{font-size:23px;font-weight:600}.sm{font-size:18px}.note{font-size:14px;fill:#5d677a}.box{fill:#f8f9fb;stroke:#dde2ea;stroke-width:2}
