<rect x="45" y="410" width="535" height="270" rx="18" class="box"/><rect x="620" y="410" width="535" height="270" rx="18" class="box"/>
<text x="75" y="148" class="head">Africa — positive</text><text x="650" y="148" class="head">Africa — negative</text>
