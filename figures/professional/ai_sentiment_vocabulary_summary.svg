<text x="75" y="448" class="head">Europe — positive</text><text x="650" y="448" class="head">Europe — negative</text>
<text x="75" y="505" class="big">peace</text><text x="205" y="505" class="mid">freedom</text><text x="345" y="505" class="mid">security</text>
<text x="75" y="550" class="mid">United Nations</text><text x="270" y="550" class="sm">cooperation</text><text x="390" y="550" class="sm">justice</text>
<text x="75" y="595" class="sm">respect</text><text x="160" y="595" class="sm">support</text><text x="245" y="595" class="sm">human rights</text><text x="365" y="595" class="sm">organization</text>
